name: Update PROCESS IN repository About
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update repository metadata
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_METADATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then echo "::error::Missing PORTFOLIO_METADATA_TOKEN secret"; exit 1; fi
          failed=0
          update_repo() {
            local repo="$1" description="$2" website="$3" topics="$4"
            echo "::group::$repo"
            local payload
            payload=$(jq -nc --arg description "$description" --arg website "$website" 'if $website == "" then {description:$description} else {description:$description,homepage:$website} end')
            if ! gh api -X PATCH "repos/stambolce/$repo" --input - <<<"$payload" >/dev/null; then
              echo "::error::$repo description/website update failed"; failed=1
            fi
            local topics_json
            topics_json=$(jq -nc --arg topics "$topics" '{names:($topics | split(","))}')
            if ! gh api -X PUT "repos/stambolce/$repo/topics" -H "Accept: application/vnd.github+json" --input - <<<"$topics_json" >/dev/null; then
              echo "::error::$repo topics update failed"; failed=1
            fi
            echo "::endgroup::"
          }
          update_repo 'process-in' 'PROCESS IN — Enterprise Software, SaaS & AI Solutions. Building modern platforms for businesses.' 'https://processin.mk' 'process-in,saas,enterprise-software,software-development,macedonia'
          update_repo 'rezerv' 'REZERV — Fitness & Wellness Management. Memberships, bookings and payments for gyms and studios.' 'https://rezerv.mk' 'fitness-management,gym-management,booking-system,saas,memberships'
          update_repo 'dentaldesk' 'DentalDesk — Dental Practice Management. Patients, appointments and clinical workflows.' 'https://dentaldesk.mk' 'dental-software,practice-management,appointments,saas,healthcare'
          update_repo 'vetdesk' 'VetDesk — Veterinary Practice Management. Clinical records, bookings and inventory.' 'https://vetdesk.mk' 'veterinary-software,practice-management,appointments,saas,inventory'
          update_repo 'assetdesk' 'AssetDesk — IT Asset Management. Equipment tracking, inventory, QR codes and reporting.' '' 'asset-management,it-asset-management,inventory-management,qr-code,saas'
          update_repo 'evento' 'EVENTO — Event Ticketing & Management Platform. Ticket sales, validation and organizer tools.' '' 'event-management,ticketing,event-ticketing,saas,online-tickets'
          update_repo 'coder' 'CODER — AI Website & App Builder. Create websites and applications with AI-powered workflows.' 'https://coder.mk' 'ai-website-builder,no-code,ai,website-builder,saas'
          update_repo 'codehub' 'CodeHub — Developer Platform. Code snippets, projects, prompts and digital resources.' '' 'developer-tools,code-snippets,developer-resources,ai-prompts,software-development'
          update_repo 'toolkit' 'Toolkit — Online Tools Platform. Productivity, developer, security and marketing tools.' '' 'developer-tools,productivity-tools,security-tools,marketing-tools,web-tools'
          update_repo 'validate' 'VALIDATE — Survey & Research Platform. Collect feedback and turn ideas into decisions.' '' 'surveys,customer-feedback,market-research,idea-validation,saas'
          update_repo 'flowing' 'FLOWING — Domain & Website Intelligence Platform. DNS, security, reputation and email intelligence.' 'https://flowing.mk' 'domain-intelligence,dns,website-security,malware-detection,email-security'
          update_repo 'construct' 'CONSTRUCT — Construction Management OS. Projects, materials, procurement, costs and operations.' '' 'construction-management,project-management,procurement,construction-software,saas'
          update_repo 'inhost' 'INHOST — Web Hosting & Domain Services. Hosting, domains and business infrastructure.' 'https://inhost.mk' 'web-hosting,domain-registration,hosting,infrastructure,macedonia'
          update_repo 'stambolce' 'Stambol Dev — Software Engineering & SaaS Portfolio. Projects by the founder of PROCESS IN.' '' 'github-profile,software-engineering,saas,process-in'
          if [[ "$failed" -ne 0 ]]; then echo "::error::Some updates failed; review logs"; exit 1; fi
          echo "All repository metadata updates completed."
      - name: Discover new PROCESS IN repositories
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_METADATA_TOKEN }}
        shell: bash
        run: |
          bash .github/scripts/discover-process-in-repos.sh
